# `name:` pins an explicit Compose project name so this never collides with
# another project on a shared Docker host that happens to use the same
# directory name for its own compose file (confirmed happening with
# release/compose/ during testing — see that file's comment for detail).
name: voice-project-dev

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
      # BACKUPS_HOST_PATH/DEPLOY_DATABASE_PATH/DEPLOY_SCRIPTS_PATH: a plain
      # relative path here resolves against wherever `docker compose` is
      # invoked from, not always this file's own directory -- when
      # DEPLOY_DIR differs from RELEASE_DIR (Platform-driven), install_offline.sh
      # copies database/scripts into DEPLOY_DIR (not DEPLOY_DIR/<this
      # file's dir>) and exports these exact env vars for that reason.
      # Real, live-confirmed bug class, 2026-08-25 (see install_offline.sh's
      # own comment) -- silently bind-mounted an empty directory for
      # database/scripts, hard-failed for nginx.conf, on this app's own
      # release-variant compose file before it was fixed there; this is
      # the same fix, applied to the file the Packager actually reads
      # (docker_inspection.py only ever inspects the repo ROOT compose
      # file, never release/<version>/compose/ -- confirmed the hard way
      # against STT-SCHEDULE the same night).
      - ${BACKUPS_HOST_PATH:-./backups}:/var/opt/mssql/backup
      # Read-only access to the SQL Server Database Package so
      # verify_installation.sh/backup_database.sh/restore_database.sh can
      # exec sqlcmd against it directly. database/ and scripts/ are mounted
      # as siblings under /opt/dbpkg/ to preserve the same relative-path
      # relationship verify_database.sql's ":r ../database/..." includes
      # already assume (this container has none of our files otherwise —
      # it's the untouched official Microsoft image).
      - ${DEPLOY_DATABASE_PATH:-./database}:/opt/dbpkg/database:ro
      - ${DEPLOY_SCRIPTS_PATH:-./scripts}:/opt/dbpkg/scripts:ro
    ports:
      # Exposed for optional GUI access (DBeaver/SSMS/Azure Data Studio) —
      # not required for the app itself, which reaches sqlserver over the
      # internal Compose network.
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$DB_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: db-init/Dockerfile
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      # DATABASE_NAME/DATABASE_USER are computed by the Packager from this
      # app's own slug at packaging time (source: "fixed" in the
      # manifest) -- see docs/decisions/database-identity-convention.md
      # in the Air-Gapped-System-Platform repo. This app's own scripts
      # still read DB_NAME/DB_USER (their existing, working convention);
      # only the value source changes.
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  whisper:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    environment:
      # WHISPER_MODEL_PATH takes priority in whisper_service.py, and the
      # model is now baked into the image at this exact path at build time
      # (see python-service/Dockerfile) — no runtime mount needed. HF_HUB_OFFLINE
      # is a defense-in-depth safety net: even if WHISPER_MODEL_PATH were
      # unset, this makes huggingface_hub fail fast with a clear local error
      # instead of hanging on a DNS lookup.
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_MODEL_PATH: /models/whisper-medium
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: node-backend/Dockerfile
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WHISPER_SERVICE_URL: http://whisper:5001/transcribe
      # rag-chatbot is now a real, optional Compose service (see below,
      # gated behind the "rag-chatbot" profile) — reached by its stable
      # internal service name like every other internal dependency here.
      RAG_CHATBOT_URL: http://rag-chatbot:5000/api/chat
      OLLAMA_URL: http://ollama:11434
      # Optional — eDelphyn (hospital LIS). Left blank/unset by default; the
      # app degrades gracefully when unset (see settingsStore.js). See
      # .env.example for details.
      EDELPHYN_DB_SERVER: ${EDELPHYN_DB_SERVER:-}
      EDELPHYN_DB_PORT: ${EDELPHYN_DB_PORT:-1433}
      EDELPHYN_DB_NAME: ${EDELPHYN_DB_NAME:-eDelphyn}
      EDELPHYN_DB_USER: ${EDELPHYN_DB_USER:-}
      EDELPHYN_DB_PASSWORD: ${EDELPHYN_DB_PASSWORD:-}
    volumes:
      - uploads_data:/app/node-backend/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      whisper:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/mode-check', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Optional: offline RAG chatbot (Ollama) ────────────────────────
  # Both services below are gated behind the "rag-chatbot" Compose profile
  # and do NOT start with a bare `docker compose up`. Enable explicitly:
  #   docker compose --profile rag-chatbot up -d
  # Requires EDELPHYN_DB_* (above) to be filled in and reachable — the
  # chatbot has no data to index without it. See rag-chatbot/SETUP.md and
  # documentation/INSTALL_OFFLINE.md's "Enabling the optional RAG chatbot".
  ollama:
    build:
      context: .
      dockerfile: ollama/Dockerfile
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["rag-chatbot"]
    restart: unless-stopped

  rag-chatbot:
    build:
      context: .
      dockerfile: rag-chatbot/Dockerfile
    environment:
      OLLAMA_HOST: http://ollama:11434
      NODE_API_URL: http://backend:3000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles: ["rag-chatbot"]
    restart: unless-stopped
    # No published ports — reachable only via backend's authenticated
    # /api/rag-chat proxy (rag-chatbot/app.py has no auth of its own).

  nginx:
    image: nginx:1.27-alpine
    volumes:
      # Same real, live-confirmed reason as DEPLOY_DATABASE_PATH/
      # DEPLOY_SCRIPTS_PATH above -- see install_offline.sh's own comment
      # (2026-08-25: a relative path here resolved to an empty directory
      # under Platform-driven deploys, hard-failing nginx entirely).
      - ${DEPLOY_NGINX_CONF_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  uploads_data:
