# nginx/nginx.conf
# Terminates HTTPS and reverse-proxies everything to the node-backend
# container. This replaces the app's old in-app :3443 TLS (server.js never
# actually implemented that — verified by inspecting the current source —
# so there was nothing to migrate away from, just a proxy to add).
#
# HTTPS is required here, not optional: getUserMedia() (the browser mic API
# used for voice recording) refuses to run on a non-localhost origin unless
# the page is served over a secure context.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Audio recordings and Excel uploads can be a few MB each — matches the
    # multer defaults in node-backend/server.js (no explicit limit set
    # there, so this is the effective ceiling).
    client_max_body_size 50M;

    # Whisper transcription can legitimately take minutes on CPU — server.js
    # itself uses a 300s axios timeout when calling the whisper service, so
    # the proxy must allow at least that long or it will cut the response
    # off first.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;

    # Docker's embedded DNS server — without this, nginx resolves "backend"
    # ONCE at startup and caches that IP for the life of the worker process.
    # If the backend container is ever recreated (an update, a crash
    # restart, anything that gives it a new container = new internal IP),
    # nginx keeps trying the stale IP and returns 502 until nginx itself is
    # also restarted. Confirmed happening in practice. Using a variable for
    # proxy_pass (below) forces re-resolution via this resolver instead of
    # a one-time startup lookup.
    resolver 127.0.0.11 valid=10s;

    # Socket.IO (real-time chat) connects over a WebSocket, not plain HTTP —
    # nginx only relays the Upgrade handshake if it's explicitly told to via
    # these headers. Without this map, $http_upgrade being empty on a normal
    # HTTP request would forward a literal empty Connection header (invalid);
    # this falls back to "close" for non-upgrade requests and "upgrade" only
    # when the client actually asked for one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        # Redirect all plain HTTP to HTTPS — mic access requires a secure
        # context, so there's no reason to ever serve the app over :80.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Variables (not literal hostnames) in proxy_pass force nginx to use
        # the resolver above for every request instead of a cached one-time
        # DNS lookup — see the resolver comment.
        location /health {
            # Passthrough health check — node-backend has no dedicated
            # /health route today; /mode-check is the closest existing
            # lightweight endpoint that doesn't require auth.
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream/mode-check;
        }

        location / {
            set $backend_upstream http://backend:3000;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for Socket.IO's websocket transport (chat) to survive
            # this proxy — see the $connection_upgrade map above.
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
