# release/0.1.2/compose/docker-compose.yml (installed image version: 1.2.0)
# OFFLINE variant — references pre-built, pre-loaded image tags instead of
# `build:` directives. The offline server has no source code and no
# internet access, so images must come from `scripts/load_images.sh`
# (docker load) rather than being built here. This is built on the Online
# Build Workstation from the repo-root docker-compose.yml (that one DOES use
# `build:` — it's the dev/test variant), then exported via
# scripts/export_images.sh.
#
# Image tags are hardcoded (not a ${IMAGE_VERSION:-...} variable) — the
# Release Contract's RC-ART-006/RC-OFF-002 checks do literal string
# matching against this file and can't resolve shell-style variable
# expansion, so a variable here reads as "no matching offline archive"
# even when one genuinely exists (same finding already documented against
# STT-SCHEDULE's own compose file). A future version bump means editing
# these tags directly, matching the Playbook's own "immutable, versioned
# tags" rule anyway.
#
# `name:` pins an explicit Compose project name. Without this, Compose
# derives the project name from the current directory's basename — and
# since this file lives in a directory literally called "compose" (a common
# convention across RAH Lab release packages), two unrelated projects
# deployed on the same Docker host can collide under the same default
# project name, causing container/volume/network name clashes and orphaned
# containers from one project showing up in `docker compose ps` for the
# other. Confirmed this actually happening on this shared host during
# testing (an unrelated project's leftover container appeared as an
# "orphan" of this project). Every RAH Lab release should set this.
name: voice-project

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
      # BACKUPS_HOST_PATH defaults to ../backups (manual-run convenience,
      # relative to this compose/ directory) but must be overridden to the
      # real canonical deployment path's own backups/ directory whenever
      # this compose file is invoked from Release Storage (which is
      # immutable) rather than the live deployment -- every lifecycle
      # script sets this explicitly when RAH_ACTIVE_DEPLOYMENT_PATH is set.
      - ${BACKUPS_HOST_PATH:-../backups}:/var/opt/mssql/backup
      # Read-only access to the SQL Server Database Package so
      # verify_installation.sh/backup_database.sh/restore_database.sh can
      # exec sqlcmd against it directly — mirrors repo-root's database/ +
      # scripts/ sibling layout under /opt/dbpkg/ so verify_database.sql's
      # ":r ../database/..." includes resolve correctly.
      #
      # DEPLOY_DATABASE_PATH/DEPLOY_SCRIPTS_PATH default to the relative
      # Release-Storage paths (manual-run convenience, same directory this
      # compose file itself lives in) but must be overridden to real,
      # absolute deployment-path copies whenever the RAH Offline
      # Installation Platform invokes this compose file: Platform's own
      # backend runs `docker compose` from inside its own container via
      # the host's Docker socket, so a relative path here resolves against
      # Platform's own container filesystem view of Release Storage
      # (/data/releases/...) rather than the real host path the Docker
      # daemon needs — silently bind-mounting an empty, Docker-auto-created
      # directory instead of this Release's real content (confirmed live,
      # 2026-08-25: both mounts came back empty under Platform, no error).
      # install_offline.sh/update_offline.sh copy the real content into
      # the deployment path specifically so these can be absolute,
      # identity-mapped paths instead (matching how RAH_ACTIVE_DEPLOYMENT_PATH
      # itself, under /opt/rah/apps, is identity-mapped and already works).
      - ${DEPLOY_DATABASE_PATH:-../database}:/opt/dbpkg/database:ro
      - ${DEPLOY_SCRIPTS_PATH:-../scripts}:/opt/dbpkg/scripts:ro
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$DB_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: voice-project-db-init:1.2.0
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  whisper:
    image: voice-project-whisper:1.2.0
    environment:
      # WHISPER_MODEL_PATH takes priority in whisper_service.py, and the
      # model is now baked into the image at build time (no more
      # assets/whisper-model-medium.zip / runtime bind-mount — see
      # RELEASE_NOTES.md's 1.2.0 section for why this changed). HF_HUB_OFFLINE
      # is a defense-in-depth safety net so any accidental fallback to
      # name-based lookup fails fast with a clear local error instead of
      # hanging on a DNS lookup that can never succeed on this host.
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_MODEL_PATH: /models/whisper-medium
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped

  backend:
    image: voice-project-backend:1.2.0
    environment:
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WHISPER_SERVICE_URL: http://whisper:5001/transcribe
      RAG_CHATBOT_URL: http://rag-chatbot:5000/api/chat
      OLLAMA_URL: http://ollama:11434
      # Optional — eDelphyn (hospital LIS). Left blank/unset by default; the
      # app degrades gracefully when unset (see settingsStore.js). See
      # .env.offline.template for details, including the SQL-login-vs-
      # Windows-Auth prerequisite.
      EDELPHYN_DB_SERVER: ${EDELPHYN_DB_SERVER:-}
      EDELPHYN_DB_PORT: ${EDELPHYN_DB_PORT:-1433}
      EDELPHYN_DB_NAME: ${EDELPHYN_DB_NAME:-eDelphyn}
      EDELPHYN_DB_USER: ${EDELPHYN_DB_USER:-}
      EDELPHYN_DB_PASSWORD: ${EDELPHYN_DB_PASSWORD:-}
      ALLOW_RUNTIME_DB_SETTINGS: ${ALLOW_RUNTIME_DB_SETTINGS:-false}
    volumes:
      - uploads_data:/app/node-backend/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      whisper:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/mode-check', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Optional: offline RAG chatbot (Ollama) ────────────────────────
  # Both services below are gated behind the "rag-chatbot" Compose profile
  # and do NOT start with a bare `docker compose up` / install_offline.sh.
  # Enable explicitly:  docker compose --profile rag-chatbot up -d
  # See documentation/INSTALL_OFFLINE.md's "Enabling the optional RAG
  # chatbot" and "Prerequisites" sections before enabling this at a
  # hospital site.
  ollama:
    image: voice-project-ollama:1.2.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["rag-chatbot"]
    restart: unless-stopped

  rag-chatbot:
    image: voice-project-rag-chatbot:1.2.0
    environment:
      OLLAMA_HOST: http://ollama:11434
      NODE_API_URL: http://backend:3000
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      ollama:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles: ["rag-chatbot"]
    restart: unless-stopped
    # No published ports — reachable only via backend's authenticated
    # /api/rag-chat proxy (rag-chatbot/app.py has no auth of its own).

  nginx:
    image: nginx:1.27-alpine
    volumes:
      # Same real, live-confirmed reason as DEPLOY_DATABASE_PATH/
      # DEPLOY_SCRIPTS_PATH above — a relative path here resolved to an
      # unreachable Release-Storage path from the host daemon's own
      # perspective, and (unlike a directory-to-directory mount) this one
      # failed loudly: Docker auto-created a directory at that wrong path,
      # which then couldn't be bind-mounted onto nginx.conf's own file
      # destination ("not a directory... mount a directory onto a file").
      - ${DEPLOY_NGINX_CONF_PATH:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_NGINX_CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    ports:
      # Operator-configurable, not hardcoded -- a shared offline host running
      # more than one RAH Lab project can't have every one of them claim the
      # OS-default 80/443 (confirmed colliding live, 2026-08-25, with an
      # unrelated project's own port 80 on the same host).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  uploads_data:
